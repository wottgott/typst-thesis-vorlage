# Abkürzungsverzeichnis. Jeder Eintrag besteht aus drei Zeilen: key ist der
# Kurzname, mit dem du im Text darauf verweist, short ist die Abkürzung und
# long die ausgeschriebene Form. Weitere Einträge kopierst du einfach darunter.
# Steht in der Datei nur "[]", entfällt das Abkürzungsverzeichnis.
- key: API
  short: API
  long: Application Programming Interface
- key: KI
  short: KI
  long: Künstliche Intelligenz
