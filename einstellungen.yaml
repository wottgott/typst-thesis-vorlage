# ============================================================
#  EINSTELLUNGEN
#  Alles, was sich an der Arbeit einstellen lässt, steht in dieser Datei.
#  Verändere nur die Werte hinter dem Doppelpunkt und lass die Einrückungen
#  (die Leerzeichen am Zeilenanfang) unverändert, weil die Datei sonst
#  nicht mehr gelesen werden kann.
# ============================================================

# Sprache der Arbeit: "de" (Deutsch) oder "en" (Englisch)
lang: de

# Abgabedatum im Format "JJJJ-MM-TT". Bleibt das Feld leer (""), nimmt die Vorlage das heutige Datum.
date: "2027-01-31"

# ------------------------------------------------------------
#  ANGABEN ZUR ARBEIT (Titelseite und Erklärung)
# ------------------------------------------------------------
data:
    title: "Titel der Arbeit"
    subtitle: "Untertitel der Arbeit"
    authors:
        - Name: Vorname Nachname
          StudentId: 12345
    supervisors:
        first:
            Name: Prof. Dr. Erstprüfer/in
        second:
            Name: Prof. Dr. Zweitprüfer/in
        # Gibt es einen Praxisbetreuer im Unternehmen, entfernst du bei den
        # drei Zeilen darunter das "#" am Zeilenanfang und trägst die Daten ein.
        # external:
        #     Name: Vorname Nachname
        #     Company: Firmenname

# ------------------------------------------------------------
#  AUSSEHEN
#  Zahlen schreibst du immer mit Einheit in Anführungszeichen, etwa
#  "2.5cm" (Zentimeter), "11pt" (Punkt) oder "1.2em" (ein Vielfaches der
#  Schriftgröße). Die Werte unten entsprechen den HdM-Vorgaben in leicht
#  verkleinerter Form.
# ------------------------------------------------------------
layout:
    Type: bachelor            # bachelor oder master
    Study: Medieninformatik   # Studiengang, steht auf der Titelseite
    Degree: Bachelor of Science
    Institute: Hochschule der Medien Stuttgart
    Location: Stuttgart       # Ort in der Ehrenwörtlichen Erklärung

    # Schriftarten (Arial ist unter Windows und auf dem Mac vorhanden).
    fonts:
        body: Arial                     # Fließtext
        heading: Arial                     # Überschriften

    # Seitenränder
    page:
        margin-top: "3.5cm"
        margin-bottom: "2.5cm"
        margin-x: "2.5cm"         # links und rechts
        header-start-page: 3      # ab dieser Seite erscheinen Kopf- und Fußzeile
        header-logo-height: "2.5em"

    # Schrift und Abstände
    typography:
        body-size: "11pt"         # Schriftgröße Fließtext
        body-leading: "1.2em"     # Abstand zwischen den Zeilen
        body-spacing: "1.8em"     # Abstand zwischen Absätzen
        caption-align: left       # Bildunterschriften: left, center oder right
        heading-leading: "0.5em"  # Zeilenabstand innerhalb einer Überschrift
        heading-above: "1.8em"    # Abstand über einer Überschrift
        heading-below: "1em"      # Abstand unter einer Überschrift
        heading-sizes:
            h1: "20pt"            # Kapitel
            h2: "16pt"            # Abschnitt
            h3: "14pt"            # Unterabschnitt
            h4: "12pt"
